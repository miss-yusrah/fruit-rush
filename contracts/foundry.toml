[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir = false
ffi = false
verbosity = 2

[rpc_endpoints]
celo_mainnet = "${CELO_RPC_URL}"
celo_testnet = "https://alfajores-forno.celo-testnet.org"

[etherscan]
celo_mainnet = { key = "${CELOSCAN_API_KEY}", url = "https://api.celoscan.io/api" }
celo_testnet = { key = "${CELOSCAN_API_KEY}", url = "https://api-alfajores.celoscan.io/api" }

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = true
